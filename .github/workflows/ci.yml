name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit
        run: bun audit

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Build deployment image
        run: docker build --pull --tag sleepover:ci .

      - name: Smoke test deployment image
        run: |
          docker run --detach --rm --name sleepover-ci \
            --publish 127.0.0.1:3000:3000 \
            --env SESSION_SECRET=ci-runtime-only-secret-at-least-32-characters \
            --env SLACK_BOT_TOKEN=xoxb-ci-runtime-placeholder \
            sleepover:ci
          trap 'docker logs sleepover-ci; docker stop sleepover-ci' EXIT
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/
